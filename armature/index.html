<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A lattice of white rods and ball joints you fly through.">
<title>Armature</title>
<style>
  :root{--ink:#0B0B0C;--panel:#111114;--line:#232326;--text:#E9E9E7;--dim:#83868C;--hi:#9CD2FF}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#000}
  body{font:14px/1.6 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;color:var(--text);
       display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #cv.drag{cursor:grabbing}
  #back{position:absolute;left:16px;top:14px;z-index:6;color:var(--dim);font-size:12.5px;
        text-decoration:none;letter-spacing:.04em}
  #back:hover{color:var(--text)}
  #back:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  #hint{position:absolute;left:16px;bottom:12px;z-index:5;color:var(--dim);font-size:12px;
        pointer-events:none;transition:opacity .5s cubic-bezier(.32,.72,0,1)}
  #hint.gone{opacity:0}
  #bar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;
       background:var(--panel);border-top:1px solid var(--line)}
  #title{flex:1;min-width:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  #fps{flex:none;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:4px;
    padding:7px 12px;font:500 12.5px/1 inherit;cursor:pointer;white-space:nowrap;
    transition:border-color .18s cubic-bezier(.32,.72,0,1),color .18s cubic-bezier(.32,.72,0,1)}
  button:hover{border-color:var(--hi);color:var(--hi)}
  button[aria-pressed="true"]{border-color:var(--hi);color:var(--hi)}
  #panel{position:absolute;top:0;right:0;bottom:0;width:min(290px,86%);background:rgba(17,17,20,.95);
    backdrop-filter:blur(10px);border-left:1px solid var(--line);padding:18px 18px 30px;
    overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  #panel.open{transform:none}
  #panel h2{font:400 11px/1 inherit;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
  label{display:block;margin:0 0 11px}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
  .row b{font-weight:500;font-size:12.5px}
  .row span{color:var(--hi);font-size:12px;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--hi);height:18px;margin:0;background:transparent}
  .checks{display:flex;flex-wrap:wrap;gap:9px 14px;margin-bottom:6px}
  .checks label{display:flex;align-items:center;gap:6px;margin:0;font-size:12.5px}
  input[type=checkbox]{accent-color:var(--hi);width:15px;height:15px;margin:0}
  .note{color:var(--dim);font-size:12px;margin:16px 0 0;padding-top:13px;border-top:1px solid var(--line)}
  .note b{color:var(--text);font-weight:500}
  .note time{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){#panel,#hint,button{transition:none}}
  @media (max-width:620px){#bar{gap:8px;padding:9px 11px}button{padding:7px 9px;font-size:12px}
    #title{letter-spacing:.12em;font-size:11.5px}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>
  <a id="back" href="../">← Tony’s Trials</a>
  <p id="hint">Drag to steer · scroll to change speed</p>
  <aside id="panel" aria-label="Controls">
    <h2>Structure</h2><div id="g-s"></div>
    <h2>Camera &amp; light</h2><div id="g-c"></div>
    <h2>Toggles</h2><div class="checks" id="g-f"></div>
    <p class="note">Rods and joints sit at real depths, so near ones sweep past while the far
      ones barely move. That difference is the whole effect.<br><br>
      <b>Tony Xin</b><br><time datetime="2026-08-15">2026-08-15</time></p>
  </aside>
</div>

<div id="bar">
  <button id="play" aria-pressed="false">Pause</button>
  <button id="reset">Recentre</button>
  <button id="reseed">New lattice</button>
  <div id="title">Armature</div>
  <div id="fps"></div>
  <button id="toggle" aria-pressed="false" aria-controls="panel">Controls</button>
</div>

<script>
/* ============================================================
   Armature —— 三维杆件晶格，镜头从中穿行

   和平面作品的根本差别：每根杆有真实的 z，两端各自投影。
   近处的杆掠过得快、远处的几乎不动——实测参考视频里这个比值是 21×
   （中心区 0.5s 移动 2.0px，边缘区 42.3px）。视差就是这件东西的全部效果，
   用二维缩放假装不出来。
   ============================================================ */

const SPEC=[
  ['rings',  'g-s','Rings',        10,  90, 1,  44,  v=>v],
  ['spokes', 'g-s','Spokes / ring',  3,  40, 1,  16,  v=>v],
  ['gap',    'g-s','Ring spacing', .18,1.60,.02,0.62, v=>v.toFixed(2)],
  ['rIn',    'g-s','Inner radius', .05,1.20,.01,0.52, v=>v.toFixed(2)],
  ['rOut',   'g-s','Outer radius', .30,3.00,.02,1.30, v=>v.toFixed(2)],
  ['jitter', 'g-s','Irregularity',   0, 100, 1,  34,  v=>v+'%'],
  ['hoops',  'g-s','Hoops',          0, 100, 1,  78,  v=>v+'%'],
  ['chords', 'g-s','Chords',         0, 100, 1,  30,  v=>v+'%'],
  ['blades', 'g-s','Blades',         0, 100, 1,   9,  v=>v+'%'],
  ['twist',  'g-s','Twist / ring', -14,  14,.2, 4.5,  v=>v.toFixed(1)+'°'],

  ['speed',  'g-c','Travel',       -14,  30,.5, 5.5,  v=>v.toFixed(1)],
  ['spin',   'g-c','Spin',         -30,  30,.5, 4.0,  v=>v.toFixed(1)+'°/s'],
  ['fov',    'g-c','Field of view',.35,1.60,.05,0.78, v=>v.toFixed(2)],
  ['thick',  'g-c','Rod thickness',.30,3.00,.05,0.72, v=>v.toFixed(2)],
  ['lampR',  'g-c','Lamp size',      0, 100, 1,  46,  v=>v+'%'],
  ['keyDir', 'g-c','Light angle',    0, 360, 1, 214,  v=>v+'°'],
];
const FLAGS=[['joints','Ball joints',true],['lamp','Centre lamp',true],['fog','Depth falloff',true]];

const P={}; SPEC.forEach(([k,,,,,,d])=>P[k]=d); FLAGS.forEach(([k,,d])=>P[k]=d);
P.seed='armature';

/* 可复现随机 */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function mulberry32(a){return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const $=id=>document.getElementById(id);
for(const [k,g,label,min,max,step,def,fmt] of SPEC){
  const l=document.createElement('label');
  l.innerHTML=`<div class="row"><b>${label}</b><span></span></div>`;
  const i=document.createElement('input');
  i.type='range';i.min=min;i.max=max;i.step=step;i.value=def;
  l.appendChild(i);$(g).appendChild(l);
  const o=l.querySelector('span');o.textContent=fmt(def);
  i.addEventListener('input',()=>{P[k]=parseFloat(i.value);o.textContent=fmt(P[k]);
    if(['rings','spokes','rIn','rOut','jitter','blades','twist','hoops','chords'].includes(k))build();});
}
for(const [k,label,def] of FLAGS){
  const l=document.createElement('label');const c=document.createElement('input');
  c.type='checkbox';c.checked=def;l.appendChild(c);l.appendChild(document.createTextNode(label));
  $('g-f').appendChild(l);c.addEventListener('change',()=>P[k]=c.checked);
}

/* ---------- 结构：一次生成，之后只投影 ---------- */
/* 每根杆两端各有自己的 (x,y,z)。让两端 z 不同，杆才会斜穿景深，
   而不是全部平贴在一个个薄片上。 */
let parts=[];
function build(){
  const r=mulberry32(hashStr(P.seed));
  const J=P.jitter/100;
  parts=[];
  for(let i=0;i<P.rings;i++){
    const z0=i*P.gap;
    const phase=i*P.twist*Math.PI/180 + (r()-.5)*J*0.9;
    const rin =P.rIn *(1+(r()-.5)*J*0.7);
    const rout=P.rOut*(1+(r()-.5)*J*0.7);
    const n=Math.max(3,Math.round(P.spokes*(1+(r()-.5)*J*0.5)));
    const isBlade=r()<P.blades/100;
    const tip=[];                              // 记下每根辐条的尖端，箍和弦要连它们
    for(let j=0;j<n;j++){
      const a=phase+j/n*Math.PI*2;
      const dz=(r()-.5)*P.gap*1.6*J;          // 让杆斜穿景深
      const wob=(r()-.5)*J*0.25;
      const tx=Math.cos(a+wob)*rout, ty=Math.sin(a+wob)*rout, tz=z0+dz;
      tip.push([tx,ty,tz]);
      parts.push({
        kind:isBlade&&r()<0.55?'blade':'rod',
        ring:i,
        x0:Math.cos(a)*rin,  y0:Math.sin(a)*rin,  z0:z0,
        x1:tx, y1:ty, z1:tz,
        a, w:0.5+r()*1.1, ball:0.055+r()*0.055,
        bw:0.06+r()*0.09, shade:0.55+r()*0.45
      });
    }
    // 箍：把相邻杆尖连起来。少了它，整个东西只是烟花，不是结构。
    if(r()<P.hoops/100){
      for(let j=0;j<n;j++){
        const A=tip[j], B=tip[(j+1)%n];
        parts.push({kind:'rod',ring:i,
          x0:A[0],y0:A[1],z0:A[2], x1:B[0],y1:B[1],z1:B[2],
          a:0, w:0.34+r()*0.4, ball:0, bw:0, shade:0.5+r()*0.4});
      }
    }
    // 弦：跨 k 个尖端相连，形成星形多边形（参考画面里那层交叉网）
    if(n>=7 && r()<P.chords/100){
      const k=2+Math.floor(r()*Math.min(4,(n-3)/2));
      for(let j=0;j<n;j++){
        const A=tip[j], B=tip[(j+k)%n];
        parts.push({kind:'rod',ring:i,
          x0:A[0],y0:A[1],z0:A[2], x1:B[0],y1:B[1],z1:B[2],
          a:0, w:0.26+r()*0.3, ball:0, bw:0, shade:0.42+r()*0.4});
      }
    }
  }
  parts.sort((p,q)=>p.ring-q.ring);
}

/* ---------- 渲染 ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);

// ox/oy 是相机在三维里的横向位置，不是画面平移。
// 平移所有像素点是假的：真相机横移时近处比远处移动得多，那才是视差。
const cam={z:0,spin:0,ox:0.42,oy:-0.26,tgX:0.42,tgY:-0.26,push:0};
let paused=false;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const Z_NEAR=0.16;

function render(g,w,h,dpr,p,cm){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  const f=Math.min(w,h)*p.fov;
  const depth=p.rings*p.gap;
  const kx=Math.cos(p.keyDir*Math.PI/180), ky=Math.sin(p.keyDir*Math.PI/180);
  const cs=Math.cos(cm.spin), sn=Math.sin(cm.spin);
  const diag=Math.hypot(w,h);

  if(p.lamp){                      // 轴心的灯：先画，让杆压在它前面
    const lr=Math.min(w,h)*0.5*p.lampR/100;
    if(lr>1){
      const lg=g.createRadialGradient(cx,cy,0,cx,cy,lr);
      lg.addColorStop(0,'rgba(255,255,255,1)');
      lg.addColorStop(.10,'rgba(255,255,255,.92)');
      lg.addColorStop(.34,'rgba(226,238,255,.28)');
      lg.addColorStop(1,'rgba(180,210,255,0)');
      g.fillStyle=lg;g.beginPath();g.arc(lx,ly,lr,0,6.2832);g.fill();
    }
  }

  // 由远及近，近处压在远处上面
  const vis=[];
  for(const it of parts){
    let za=it.z0-cm.z, zb=it.z1-cm.z;
    za-=Math.floor(za/depth)*depth;  zb=za+(it.z1-it.z0);   // 无限循环：整环一起绕回
    if(za<Z_NEAR||za>depth) continue;
    vis.push({it,za,zb});
  }
  vis.sort((a,b)=>b.za-a.za);

  for(const {it,za,zb} of vis){
    const sa=f/za, sb=f/Math.max(Z_NEAR,zb);
    const X0= it.x0*cs-it.y0*sn, Y0=it.x0*sn+it.y0*cs;
    const X1= it.x1*cs-it.y1*sn, Y1=it.x1*sn+it.y1*cs;
    const ax=cx+(X0-cm.ox)*sa, ay=cy+(Y0-cm.oy)*sa,
          bx=cx+(X1-cm.ox)*sb, by=cy+(Y1-cm.oy)*sb;
    if((ax<-diag&&bx<-diag)||(ax>w+diag&&bx>w+diag)) continue;
    if((ay<-diag&&by<-diag)||(ay>h+diag&&by>h+diag)) continue;

    // 深度衰减：远端压暗，近端全亮
    const fog=p.fog?Math.max(.16,Math.min(1,1.25-za/depth*1.15)):1;
    // 朝光的一侧更亮：杆的方向与光向的夹角
    const dx=bx-ax, dy=by-ay, dl=Math.hypot(dx,dy)||1;
    const facing=0.5+0.5*(-dy/dl*ky + -dx/dl*kx);
    const lum=Math.max(0,Math.min(1,(0.42+0.58*facing)*it.shade*fog));

    if(it.kind==='blade'){
      const nxp=-dy/dl, nyp=dx/dl, bw=it.bw*sb*0.5;
      g.beginPath();
      g.moveTo(ax+nxp*bw*0.35,ay+nyp*bw*0.35);
      g.lineTo(bx+nxp*bw,by+nyp*bw);
      g.lineTo(bx-nxp*bw,by-nyp*bw);
      g.lineTo(ax-nxp*bw*0.35,ay-nyp*bw*0.35);
      g.closePath();
      const v=Math.round(150+95*lum);
      g.fillStyle=`rgb(${v},${v},${Math.min(255,v+4)})`;g.fill();
      continue;
    }

    // 圆管：两道描边冒充圆柱——底色偏暗的宽线，再叠一条偏移的窄高光
    const wpx=Math.max(.45, it.w*p.thick*sb*0.030);
    const base=Math.round(96+96*lum), hi=Math.round(200+55*lum);
    g.lineCap='round';
    g.strokeStyle=`rgb(${base},${base},${base+3})`;
    g.lineWidth=wpx; g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();
    if(wpx>1.3){
      const ox=-dy/dl*wpx*0.22, oy=dx/dl*wpx*0.22;
      g.strokeStyle=`rgb(${hi},${hi},${Math.min(255,hi+3)})`;
      g.lineWidth=wpx*0.38;
      g.beginPath();g.moveTo(ax+ox,ay+oy);g.lineTo(bx+ox,by+oy);g.stroke();
    }

    if(p.joints&&it.ball>0){       // 球关节：底色球 + 偏向光源的高光点
      const br=it.ball*sb;
      if(br>0.7){
        const bv=Math.round(70+120*lum);
        g.fillStyle=`rgb(${bv},${bv},${bv+4})`;
        g.beginPath();g.arc(bx,by,br,0,6.2832);g.fill();
        g.fillStyle=`rgba(255,255,255,${0.55+0.45*lum})`;
        g.beginPath();g.arc(bx+kx*br*0.32,by+ky*br*0.32,br*0.52,0,6.2832);g.fill();
      }
    }
  }
  return vis.length;
}

/* ---------- 主循环 ---------- */
let last=performance.now(),acc=0,frames=0,shown=0;
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused){
    const v=(reduce?0:P.speed)+cam.push;
    cam.z+=v*dt; cam.push*=Math.pow(0.06,dt);
    if(!reduce) cam.spin+=P.spin*Math.PI/180*dt;
    const depth=P.rings*P.gap;
    cam.z-=Math.floor(cam.z/depth)*depth;
  }
  cam.ox+=(cam.tgX-cam.ox)*Math.min(1,dt*3.2);
  cam.oy+=(cam.tgY-cam.oy)*Math.min(1,dt*3.2);
  shown=render(ctx,W,H,DPR,P,cam);
  acc+=dt;frames++;
  if(acc>0.5){$('fps').textContent=`${Math.round(frames/acc)} fps · ${shown}`;frames=0;acc=0}
  requestAnimationFrame(tick);
}

/* ---------- 交互 ---------- */
let dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;
  cv.classList.add('drag');cv.setPointerCapture(e.pointerId);$('hint').classList.add('gone')});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const k=2.4/Math.min(W,H);                 // 像素 → 世界单位
  cam.tgX=Math.max(-2.4,Math.min(2.4,cam.tgX-(e.clientX-lx)*k));
  cam.tgY=Math.max(-2.4,Math.min(2.4,cam.tgY-(e.clientY-ly)*k));
  lx=e.clientX;ly=e.clientY;
});
addEventListener('pointerup',()=>{dragging=false;cv.classList.remove('drag')});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.push-=e.deltaY*0.02},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();setPaused(!paused)}
});
function setPaused(v){paused=v;const b=$('play');b.textContent=v?'Play':'Pause';
  b.setAttribute('aria-pressed',v?'true':'false')}
$('play').onclick=()=>setPaused(!paused);
$('reset').onclick=()=>{cam.tgX=0.42;cam.tgY=-0.26;cam.push=0};
$('reseed').onclick=()=>{P.seed=Math.random().toString(36).slice(2,9);build()};
$('toggle').onclick=e=>{const open=$('panel').classList.toggle('open');
  e.currentTarget.setAttribute('aria-pressed',open?'true':'false')};

resize(); build();
if(reduce){setPaused(true);$('hint').textContent='Paused for reduced motion. Press Play to start.'}
setTimeout(()=>$('hint').classList.add('gone'),6500);
requestAnimationFrame(tick);
</script>
</body>
</html>
