<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一封朋友手写的信，做成会转的文字隧道。">
<title>Life Is an Ocean</title>
<style>
/* 单一深色主题：作品本身是黑底发光，浅色主题会毁掉它。
   这是选择，不是遗漏——所以每个颜色都显式声明，不借宿主背景。 */
:root{
  --void:#05060A;    /* 页底：带一丝蓝偏的近黑，衬得画布的纯黑更深 */
  --ink:#0C0F16;     /* 面板 */
  --line:#1E2430;    /* 细线 */
  --dim:#7C8798;     /* 次要文字，冷灰 */
  --paper:#E9E4D8;   /* 正文：暖白，呼应笔记本纸 */
  --gold:#E0B872;    /* 强调：取自动画里标题的金 */
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",
         system-ui,-apple-system,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--void); color:var(--paper);
  font:15px/1.65 var(--sans);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---- 观看区 ---- */
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#hint{position:absolute;left:16px;top:14px;color:var(--dim);font-size:12px;
      letter-spacing:.06em;pointer-events:none;
      transition:opacity .5s cubic-bezier(.32,.72,0,1)}
#hint.gone{opacity:0}
#back{position:absolute;left:16px;top:14px;z-index:6;color:var(--dim);font-size:12.5px;
  text-decoration:none;letter-spacing:.04em}
#back:hover{color:var(--paper)}
#back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.credit{color:var(--dim);font-size:12px;line-height:1.7;margin:18px 0 0;
  padding-top:14px;border-top:1px solid var(--line)}
.credit b{color:var(--paper);font-weight:500}
.credit time{font-variant-numeric:tabular-nums}

/* ---- 走带 ---- */
#bar{flex:none;display:flex;align-items:center;gap:14px;
     padding:11px 16px;background:var(--ink);border-top:1px solid var(--line)}
#now{flex:1;min-width:0;font-family:var(--serif);font-size:17px;letter-spacing:.10em;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--paper)}
#now.title{color:var(--gold)}
#clock{flex:none;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.grp{flex:none;display:flex;gap:6px}
button{
  background:transparent;border:1px solid var(--line);color:var(--paper);
  border-radius:4px;padding:8px 13px;font:500 13px/1 var(--sans);cursor:pointer;
  transition:border-color .18s cubic-bezier(.32,.72,0,1),color .18s cubic-bezier(.32,.72,0,1);
}
button:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* ---- 抽屉 ---- */
#drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(320px,86%);
  background:var(--ink);border-left:1px solid var(--line);
  padding:20px 20px 32px;overflow-y:auto;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
#drawer.open{transform:none}
#drawer h2{font:400 13px/1 var(--sans);letter-spacing:.18em;color:var(--dim);
           margin:0 0 14px;text-transform:uppercase}
ol{list-style:none;margin:0 0 26px;padding:0;
   display:flex;flex-direction:column;gap:2px}
ol li{font-family:var(--serif);font-size:15px;letter-spacing:.08em;
      color:var(--dim);padding:5px 9px;border-left:2px solid transparent;
      cursor:pointer;transition:color .2s,border-color .2s}
ol li:hover{color:var(--paper)}
ol li[aria-current="true"]{color:var(--gold);border-left-color:var(--gold)}
ol li:first-child{font-size:16px}
label{display:block;margin:0 0 13px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.row b{font-weight:500;font-size:12.5px;color:var(--paper)}
.row span{color:var(--gold);font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--gold);height:18px;margin:0;
                  background:transparent}
input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.note{color:var(--dim);font-size:12px;margin:18px 0 0;padding-top:14px;
      border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){
  #drawer,#hint,button{transition:none}
}
@media (max-width:600px){
  #now{font-size:15px;letter-spacing:.06em}
  button{padding:8px 10px;font-size:12.5px}
  #bar{gap:9px;padding:9px 11px}
}
/* 窄屏下按钮 + 当前句 + 计时挤在一行会撑破。
   计时是读数，Previous/Next 在窄屏有滑动和键盘可替代——先让这几个走。
   （加 Sound 按钮之后 390px 实测横向溢出，这段是为此加的。） */
@media (max-width:560px){
  #clock{display:none}
  #prev,#next{display:none}
}
@media (max-width:400px){
  #now{font-size:13.5px;letter-spacing:.02em}
  button{padding:7px 8px;font-size:12px}
}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  </head>
<body>
<a id="back" href="../">← Tony’s Trials</a>
  <p id="hint">Drag to look around · the piano starts the moment you touch the page</p>
  <aside id="drawer" aria-label="诗与参数">
    <h2>Full text</h2>
    <ol id="toc"></ol>
    <h2>Controls</h2>
    <div id="g"></div>
    <p class="note">Every character in the wall is taken from the letter itself.</p>
    <p class="credit">
      Text: from a friend’s letter, used with permission<br>
      Work: <b>Tony Xin</b><br>
      <time datetime="2026-08-15">2026-08-15</time>
    </p>
  </aside>
</div>

<div id="bar">
  <div class="grp">
    <button id="play" aria-pressed="false">Pause</button>
    <button id="prev" title="Previous">Previous</button>
    <button id="next" title="Next">Next</button>
    <button id="sound" aria-pressed="true">Sound off</button>
  </div>
  <div id="now"></div>
  <div id="clock"></div>
  <div class="grp">
    <button id="toggle" aria-pressed="false" aria-controls="drawer">Text / Controls</button>
  </div>
</div>

<script>
const DEFAULT_POEM =
`Life Is an Ocean
这么顺的日子
不写点啥
怪不好意思
一想到未来七十年
我将会无组织
无纪律地过下去
我就非常兴奋
这或许就是
人生可以重来一次
的绝好机会
我希望接下来
的每一步都是喜欢
不是衡量
每一天都顺随本心
不是困顿庸碌
你们知道的
我会也会邀请你们
和我一起
一直折腾一直美
一路热忱一路逛
岁岁安澜`;

const SPEC=[
  ['turn',  'Full turn',    12, 180,  1,  84,  v=>v+'s'],
  ['readAt','Reading spot', -180, 180,  5,  90,  v=>v===90?'bottom':(v===-90?'top':v+'°')],
  ['trad',  'Ring radius',   .30,0.95,.01,0.60, v=>v.toFixed(2)],
  ['tsize', 'Text size',   0.4, 2.0,.05, 0.90, v=>v.toFixed(2)],
  ['flow',  'Tunnel flow',    -40,  60,  1,  11,  v=>v],
  ['cols',  'Glyphs per ring',      16, 140,  1,  68,  v=>v],
  ['rings', 'Rings',           8,  70,  1,  26,  v=>v],
  ['gap',   'Ring spacing',      1.03,1.28,.005,1.100,v=>v.toFixed(3)],
  ['fill',  'Glyph fill',   .35,1.30,.01,0.94, v=>v.toFixed(2)],
  ['wdens', 'Wall density',      0, 100,  1, 100,  v=>v+'%'],
  ['tex',   'Wall brightness',      0, 220,  1, 130,  v=>v+'%'],
  ['flick', 'Flicker',      0, 100,  1,  88,  v=>v+'%'],
  ['bloom', 'Bloom',          0, 100,  1,  55,  v=>v+'%'],
  ['fspd',  'Flicker speed',    0.2, 3.0,.05, 1.0,  v=>v.toFixed(2)+'×'],
  ['core',  'Core',      0,  45,  1,  26,  v=>v+'%'],
  ['squash','Tilt',    .45,1.00,.01,0.94,  v=>v.toFixed(2)],
  ['arcs',  'Arcs',      0, 100,  1,  55,  v=>v+'%'],

  ['vol',   'Volume',        0, 100,  1,  70,  v=>v+'%'],
  ['key',   'Key',          45,  69,  1,  57,  v=>NOTE(v)],
  ['dens',  'Notes / line',   0, 100,  1,  72,  v=>v+'%'],
  ['bass',  'Bass',           0, 100,  1,  64,  v=>v+'%'],
  ['pedal', 'Pedal',          0, 100,  1,  72,  v=>v+'%'],
  ['tone',  'Tone',         400,6000, 50,2100,  v=>v+' Hz'],
  ['rubato','Rubato',         0, 100,  1,  46,  v=>v+'%'],
];
const NOTE_NAMES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const NOTE=m=>NOTE_NAMES[m%12]+(Math.floor(m/12)-1);
const FLAGS=[['vertical','Vertical lines',true],['tangent','Follow the ring',false],['vig','Vignette',true]];

const P={};SPEC.forEach(([k,,,,,d])=>P[k]=d);FLAGS.forEach(([k,,d])=>P[k]=d);
P.poem=DEFAULT_POEM; P.bsz=0.60; P.bal=0.90;   // Bloom半径系数 / 强度系数

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function mulberry32(a){return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const ui={};
const SHOW=new Set(['turn','readAt','trad','tsize','flow','cols','wdens','tex','flick','bloom','core','arcs','vol','key','dens','bass','pedal','tone','rubato']);
for(const [k,label,min,max,step,def,fmt] of SPEC){
  if(!SHOW.has(k))continue;
  const l=document.createElement('label');
  l.innerHTML=`<div class="row"><b>${label}</b><span></span></div>`;
  const i=document.createElement('input');
  i.type='range';i.min=min;i.max=max;i.step=step;i.value=def;
  l.appendChild(i);$('g').appendChild(l);
  const o=l.querySelector('span');o.textContent=fmt(def);
  ui[k]=[i,o,fmt];
  i.addEventListener('input',()=>{P[k]=parseFloat(i.value);o.textContent=fmt(P[k]);
    if(k==='dens'||k==='cols'||k==='rings')buildField();
    if(k==='cols'||k==='gap')cellHint()});
}
// 环向格宽 2π/cols 与径向格宽 (1-1/gap) 相等时格子是方的。
// 列数多于此值 → 字在径向互相重叠 → 糊成一片而不是一格一格的亮块。踩过两次。
function cellHint(){
  const ideal=6.2832/(1-1/P.gap), ratio=P.cols/ideal;
  (document.getElementById('cellHint')||{}).textContent=`Square-cell columns ≈ ${Math.round(ideal)}`+
    (ratio>1.12?' (too many: glyphs overlap radially)':ratio<0.88?' (too few: gaps open between rows)':' (near square)');
}

/* ---------- 精灵图：纹理层每个「字×色调」只光栅化一次 ---------- */
const SPRITE_PX=84;
const FONT_TEX=`700 %dpx "PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif`;
const FONT=`"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun","Noto Sans SC","PingFang SC","WenQuanYi Zen Hei",serif`;
const TINTS=['#ffffff','#ffcf9a','#9fd0ff'];
let sprites=[],lines=[];

function tint(src,color){
  const c=document.createElement('canvas');c.width=c.height=src.width;
  const x=c.getContext('2d');x.drawImage(src,0,0);
  x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);
  return c;
}
function buildSprites(){
  const chars=[...new Set([...P.poem].filter(c=>c.trim()))];
  sprites=chars.map(ch=>{
    const c=document.createElement('canvas');c.width=c.height=SPRITE_PX;
    const x=c.getContext('2d');
    x.font=FONT_TEX.replace('%d',Math.round(SPRITE_PX*0.86));
    x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
    x.fillText(ch,SPRITE_PX/2,SPRITE_PX*0.52);
    return TINTS.map(t=>tint(c,t));
  });
}
function parsePoem(){
  lines=P.poem.split('\n').map(s=>s.trim()).filter(Boolean);
}

/* ---------- 纹理字阵 ---------- */
const TWIST=0.5, Z_NEAR=0.32;
let field=[];
function buildField(){
  const rnd=mulberry32(hashStr('poem-field'));
  field=[];
  const keep=P.dens/100;
  for(let i=0;i<P.rings;i++)for(let j=0;j<P.cols;j++){
    if(rnd()>keep){rnd();rnd();rnd();continue}      // 抽稀但保持随机流对齐
    field.push({ring:i,
      a:j/P.cols*Math.PI*2+i*TWIST*Math.PI/180+(rnd()-.5)*(Math.PI*2/P.cols)*0.10,
      rj:1+(rnd()-.5)*0.02, s:(rnd()*1e9)|0, t:rnd(), b0:rnd(),
      ph:rnd()*6.2832, w:(6.2832/1.9)*(0.55+0.9*rnd())});   // 实测：周期约 1.9s，各字异相
  }
}
function rebuildAll(){parsePoem();buildSprites();buildField()}

/* ---------- 渲染 ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);

const cam={phase:0,panX:0,panY:0,tgX:0,tgY:0};
let T=0, paused=false;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function render(g,w,h,dpr,p,t,cm){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  const cx=w/2+cm.panX, cy=h/2+cm.panY;
  const f=Math.min(w,h)*0.5;
  const diag=Math.hypot(w,h);

  /* --- 纹理层 --- */
  g.globalCompositeOperation='lighter';
  const texA=p.tex/100;
  for(let k=field.length-1;k>=0;k--){
    const it=field[k];
    const idx=(it.ring+cm.phase)%p.rings;
    const z=Z_NEAR*Math.pow(p.gap,idx)*it.rj;
    const r=f/z; if(r>diag)continue;
    const px=cx+Math.cos(it.a)*r, py=cy+Math.sin(it.a)*r*p.squash;
    if(px<-70||px>w+70||py<-70||py>h+70)continue;
    const size=(6.2832*r/p.cols)*p.fill;
    if(size<0.7)continue;
    const far=idx/p.rings<0.88?1:Math.max(0,1-(idx/p.rings-0.88)/0.12);
    // 每字独立呼吸：实测两两相关仅 0.06（各闪各的），明暗比中位 16×
    const osc=0.5+0.5*Math.sin(t*it.w*p.fspd+it.ph);
    // 陡曲线而非幂次：实测参考是「55% 死黑 + 12% 极亮」的双峰分布，
    // 平滑幂次只会得到一片中灰。字大部分时间灭着，亮就亮到底。
    const s0=(osc-0.42)/0.26, sc=s0<=0?0:s0>=1?1:s0*s0*(3-2*s0);
    // 暗态必须有下限：实体装置里暗着的字仍然看得见。
    // 归零会让直方图对上而画面变稀——统计量匹配不等于画面匹配。
    const base=1-p.flick/100*0.82;
    const fl=base+(1-base)*sc;
    const a=Math.min(1,far*Math.min(1,size/2.2)*(1-0.45*Math.pow(it.b0,1.7))*fl)*texA;
    if(a<=0.012)continue;
    const set=sprites[it.s%sprites.length]; if(!set)continue;
    const sz=Math.min(size,150), img=set[it.t<0.055?1:(it.t<0.095?2:0)];
    // 亮起来的字要晕开：参考拍的是实体灯光装置，Bloom才是亮像素的主要来源。
    // 用同一张精灵放大一圈低透明度垫在下面，additive 叠加即得（比 shadowBlur 便宜得多）
    if(a>0.42&&p.bloom>0){
      const bs=sz*(1+p.bloom/100*p.bsz);
      g.globalAlpha=a*p.bloom/100*p.bal;
      g.drawImage(img,px-bs/2,py-bs/2,bs,bs);
    }
    g.globalAlpha=a;
    g.drawImage(img,px-sz/2,py-sz/2,sz,sz);
  }
  g.globalAlpha=1;

  /* --- 亮环 --- */
  if(p.arcs>0){
    const every=Math.max(2,Math.round(p.rings/(1+p.arcs/12)));
    g.strokeStyle='rgba(228,242,255,.92)';
    for(let i=0;i<p.rings;i+=every){
      const idx=(i+cm.phase)%p.rings, r=f/(Z_NEAR*Math.pow(p.gap,idx));
      if(r<6||r>diag)continue;
      const a=(idx/p.rings<0.88?1:Math.max(0,1-(idx/p.rings-0.88)/0.12))*0.9;
      const lw=Math.max(1.1,Math.min(6,r*0.0062));
      g.beginPath();g.ellipse(cx,cy,r,r*p.squash,0,0,6.2832);
      g.globalAlpha=a*0.13;g.lineWidth=lw*7;g.stroke();      // 辉光用两道描边，不用 shadowBlur
      g.globalAlpha=a;g.lineWidth=lw;g.stroke();
    }
    g.globalAlpha=1;
  }

  /* --- Core：压在纹理之上、诗句之下，诗句才像从洞里走出来 --- */
  if(p.core>0){
    // 洞的大小直接给比例：参考画面里它占了很大一块，靠Rings推算出不来
    const rc=Math.max(Math.min(w,h)*p.core/100,(f/(Z_NEAR*Math.pow(p.gap,p.rings-1)))*1.6);
    g.globalCompositeOperation='source-over';
    const rg=g.createRadialGradient(cx,cy,0,cx,cy,rc);
    rg.addColorStop(0,'rgba(0,0,0,1)');rg.addColorStop(.5,'rgba(0,0,0,.9)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg;g.beginPath();g.ellipse(cx,cy,rc,rc*p.squash,0,0,6.2832);g.fill();
  }

  /* --- 读句层：转进来 → 读位 → 旋转着沉入黑洞 --- */
  /* 每句走一条完整的弧：从外围淡入、绕行趋近正上方「读位」（最大最亮）、
     越过读位后一边继续旋转一边向内收，最后消失在Core里。
     只绕不收会显得有始无终——收束必须回到它出发的那个中心。 */
  g.globalCompositeOperation='lighter';
  const n=lines.length; if(!n)return;
  // 读位默认在**正下方**：句子从环上转过来，停在黑洞的下缘读，然后被吸进去。
  // 原来在正上方，读的时候文字压在画面顶部，重心太高。
  const READ=p.readAt*Math.PI/180;
  // 沉入段/趋近段按「句位」计而不是按一周的固定比例：
  // 写成固定比例时，句数一多同时可见的句子就成倍增加，暗底互相叠。
  // 按句位计则任何句数下都只同时出现约六句。
  const SINK=Math.min(0.42,2.6/n), APPR=Math.min(0.5,3.4/n);
  const Rt=Math.min(w,h)*0.5*p.trad;
  for(let i=0;i<n;i++){
    const e=((t/Math.max(0.1,p.turn)-i/n)%1+1)%1;   // 符号：t 在前、i 在后。写成 i/n+t/turn 会让句号越大越早到读位，整篇倒着播 // 0 = 正在读位，→1 = 即将回到读位
    let rad,alpha,szf;
    if(e<SINK){                                   // 读完，旋转着向内收，沉进黑洞
      const k=smooth(e/SINK);
      rad=p.trad*(1-k); alpha=1-k; szf=0.55+0.75*(1-k);
    }else if(e>1-APPR){                           // 从外围转进来，趋近读位
      const k=smooth((e-(1-APPR))/APPR);
      rad=p.trad*(1.20-0.20*k); alpha=0.14+0.86*k; szf=0.52+0.78*k;
    }else continue;                               // 其余时间不在场
    if(alpha<=0.012)continue;

    const ang=READ+e*Math.PI*2;
    const R=Math.min(w,h)*0.5*rad;
    const px=cx+Math.cos(ang)*R, py=cy+Math.sin(ang)*R*p.squash;
    const isTitle=i===0;
    const fs=Math.min(w,h)*0.030*p.tsize*szf*(isTitle?1.22:1);
    if(fs<3)continue;
    const txt=[...lines[i]];

    // 字墙太密，焦点句要垫一块柔和暗底才读得出来；越沉越淡
    if(alpha>0.10){
      const br=Math.max(fs*1.5,fs*txt.length*1.24)*0.62;
      g.globalCompositeOperation='source-over';
      const bg=g.createRadialGradient(px,py,0,px,py,br);
      bg.addColorStop(0,`rgba(0,0,0,${0.86*alpha})`);
      bg.addColorStop(.62,`rgba(0,0,0,${0.55*alpha})`);
      bg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=bg;g.beginPath();g.ellipse(px,py,br,br,0,0,6.2832);g.fill();
      g.globalCompositeOperation='lighter';
    }

    g.save();
    g.translate(px,py);
    if(p.tangent)g.rotate(ang+Math.PI/2);         // Follow the ring（底部会倒置）
    g.font=`${isTitle?600:400} ${fs}px ${FONT}`;
    g.textAlign='center';g.textBaseline='middle';
    const warm=isTitle?'236,196,126':(alpha>0.55?'255,255,255':'214,198,168');
    if(p.vertical){
      const lh=fs*1.14, y0=-(txt.length-1)*lh/2;
      for(let k2=0;k2<txt.length;k2++){
        g.fillStyle=`rgba(${warm},${alpha*0.32})`; g.fillText(txt[k2],0,y0+k2*lh);
        g.fillStyle=`rgba(${warm},${alpha})`;      g.fillText(txt[k2],0,y0+k2*lh);
      }
    }else{
      g.fillStyle=`rgba(${warm},${alpha*0.32})`; g.fillText(lines[i],0,0);
      g.fillStyle=`rgba(${warm},${alpha})`;      g.fillText(lines[i],0,0);
    }
    g.restore();
  }
  g.globalCompositeOperation='source-over';

  if(p.vig){
    const vg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*0.30,w/2,h/2,Math.max(w,h)*0.74);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.86)');
    g.fillStyle=vg;g.fillRect(0,0,w,h);
  }
}

function cycle(){return P.turn}

/* ---------- 主循环 ---------- */
function cycle(){return P.turn}
// 环绕模型：ang = READ + i/n*2π + spin，转到读位(ang≡READ)的那一句最亮
function activeIdx(){
  const n=lines.length; if(!n)return -1;
  const frac=((T/P.turn)%1+1)%1;
  return Math.round(frac*n)%n;
}
let lastIdx=-2;
function paintChrome(){
  const i=activeIdx();
  $('clock').textContent=`${T.toFixed(0)} / ${cycle().toFixed(0)}s`;
  if(i===lastIdx)return;
  const prev=lastIdx; lastIdx=i;
  // 这一句刚转到读位——整页唯一的音乐事件源。
  // 挂在这里而不是自己起一个时钟：turn 怎么调，乐句就怎么跟。
  if(i>=0&&prev!==-2&&!paused) phrase(i,i===0,P.turn/Math.max(1,lines.length));
  const now=$('now');
  now.textContent=i<0?'':lines[i];
  now.classList.toggle('title',i===0);
  [...$('toc').children].forEach((li,k)=>li.setAttribute('aria-current',k===i?'true':'false'));
}

let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused){
    T+=dt; if(T>cycle())T=0;
    cam.phase=(cam.phase-P.flow*dt*0.35+P.rings*100)%P.rings;
  }
  cam.panX+=(cam.tgX-cam.panX)*Math.min(1,dt*4.2);
  cam.panY+=(cam.tgY-cam.panY)*Math.min(1,dt*4.2);
  audioSync();
  render(ctx,W,H,DPR,P,T,cam);
  paintChrome();
  requestAnimationFrame(tick);
}

/* ---------- 交互 ---------- */
let dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;
  cv.classList.add('drag');cv.setPointerCapture(e.pointerId);$('hint').classList.add('gone')});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  cam.tgX=Math.max(-W*0.4,Math.min(W*0.4,cam.tgX+e.clientX-lx));
  cam.tgY=Math.max(-H*0.4,Math.min(H*0.4,cam.tgY+e.clientY-ly));
  lx=e.clientX;ly=e.clientY;
});
addEventListener('pointerup',()=>{dragging=false;cv.classList.remove('drag')});

function setPaused(v){
  paused=v;
  const b=$('play');
  b.textContent=v?'Play':'Pause';
  b.setAttribute('aria-pressed',v?'true':'false');
}
function jump(i){
  const n=lines.length; i=((i%n)+n)%n;
  T=P.turn*(i%n)/n;                // 把这一句转到读位
  lastIdx=-2;
}
$('play').onclick=()=>setPaused(!paused);
$('prev').onclick=()=>jump((activeIdx()<0?0:activeIdx())-1);
$('next').onclick=()=>jump((activeIdx()<0?-1:activeIdx())+1);
$('toggle').onclick=e=>{
  const d=$('drawer'),open=d.classList.toggle('open');
  e.currentTarget.setAttribute('aria-pressed',open?'true':'false');
};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();setPaused(!paused)}
  if(e.code==='ArrowLeft')jump((activeIdx()<0?0:activeIdx())-1);
  if(e.code==='ArrowRight')jump((activeIdx()<0?-1:activeIdx())+1);
});


/* ============================================================
   声音：一架合成的钢琴，跟着句子走

   为什么不用现成音乐：不碰版权；站点规矩是零外部请求；
   而且最要紧的一条——**这段动画的律动是可变的**（Full turn 从 12 秒到 180 秒），
   用音频文件只能在某一个速度上对上，一改就散。

   气质参照坂本龙一晚期独奏的语汇：慢、留白多、和声是调式色彩而不是功能进行，
   踏板把音糊在一起。**写的是这个语汇里的原创材料，不复刻任何一首具体作品。**

   合成的钢琴听感是「像钢琴」，不是采样的斯坦威——这是老实话，也是取舍：
   换来的是零外部请求和真同步。
   ============================================================ */
const A={ctx:null,on:false,armed:true,last:-2,area:0,mel:2,lastNote:0};

/* 调式色彩，六个区轮转。低音按二度三度走，不走五度——
   走五度就会听出属到主的解决，那是功能和声，不是这个语汇。 */
const AREAS=[
  {bass: 0, tones:[0,7,10,14,17]},   // i9(11)
  {bass:-4, tones:[0,7,11,14,18]},   // ♭VImaj7(#11)
  {bass:-7, tones:[0,7,10,14,17]},   // iv9(11)
  {bass:-2, tones:[0,7,10,14,16]},   // ♭VII9sus
  {bass:-9, tones:[0,7,11,14,16]},   // ♭IIImaj9
  {bass:-5, tones:[0,7,10,15,17]},   // v m(♭13)
];
const mtof=m=>440*Math.pow(2,(m-69)/12);

function audioInit(){
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return false;
  const ctx=new C(); A.ctx=ctx;
  A.master=ctx.createGain(); A.master.gain.value=0; A.master.connect(ctx.destination);

  // 踏板＝混响。脉冲响应是算出来的（噪声 × 指数衰减），零外部请求照旧成立。
  const dur=3.6, sr=ctx.sampleRate;
  const ir=ctx.createBuffer(2,Math.floor(sr*dur),sr);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<d.length;i++){
      const x=i/d.length;
      d[i]=(Math.random()*2-1)*Math.pow(1-x,2.2)*(1-Math.exp(-i/(sr*0.012)));
    }
  }
  A.rev=ctx.createConvolver(); A.rev.buffer=ir;
  A.wet=ctx.createGain(); A.wet.gain.value=0.5;
  A.wet.connect(A.rev); A.rev.connect(A.master);

  A.lp=ctx.createBiquadFilter(); A.lp.type='lowpass';
  A.lp.frequency.value=P.tone; A.lp.Q.value=0.4;
  A.lp.connect(A.master); A.lp.connect(A.wet);
  return true;
}

/* 一个钢琴音。

   关键是**非谐性**：真钢琴的第 n 个泛音不在 f×n，而在 f×n×√(1+Bn²)——
   琴弦有刚度。少了这一条，加多少泛音都是风琴不是钢琴。
   另外两条：泛音越高衰减越快；音越低整体衰减越慢（低音区余韵长得多）。 */
function piano(freq,when,vel,sus){
  const ctx=A.ctx; if(!ctx)return;
  const B=0.00045+0.0009*Math.max(0,(freq-100)/700);      // 非谐性系数，高音更明显
  const base=sus*(freq<160?1.55:freq<320?1.15:freq<640?0.82:0.55);
  const N=6;
  for(let n=1;n<=N;n++){
    const f=freq*n*Math.sqrt(1+B*n*n);
    if(f>12000) break;
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain();
    const amp=vel*Math.pow(n,-1.65)*(n===1?1:0.85);
    const dec=base/(1+0.55*(n-1));                        // 高次泛音先掉
    g.gain.setValueAtTime(0,when);
    g.gain.linearRampToValueAtTime(amp,when+0.004);       // 4ms 起振，直接跳会爆音
    g.gain.exponentialRampToValueAtTime(0.00008,when+dec);
    o.connect(g); g.connect(A.lp);
    o.start(when); o.stop(when+dec+0.05);
  }
  // 击弦噪声：极短的一下，没有它每个音都像是淡入的
  const nb=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*0.03),ctx.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*(1-i/nd.length);
  const ns=ctx.createBufferSource(); ns.buffer=nb;
  const nf=ctx.createBiquadFilter(); nf.type='bandpass';
  nf.frequency.value=Math.min(6000,freq*4); nf.Q.value=0.8;
  const ng=ctx.createGain(); ng.gain.value=vel*0.14;
  ns.connect(nf); nf.connect(ng); ng.connect(A.lp); ns.start(when);
}

/* 一句到读位 → 一个乐句。

   旋律在当前和弦音上做**步进随机走**，不是随机跳。
   随机跳听起来像程序在响，步进才像有人在弹。 */
function phrase(idx,isTitle,gapSec){
  if(!A.on||!A.ctx) return;
  const ctx=A.ctx, t0=ctx.currentTime+0.02;
  if(idx%3===0) A.area=(A.area+1)%AREAS.length;            // 每三句换一次和声色彩
  const ar=AREAS[A.area], root=P.key;

  // 低音：换和声时才落一个，而且很轻。这个语汇里低音是地板不是节奏
  if(idx%3===0 && P.bass>0)
    piano(mtof(root+ar.bass-12),t0,0.16*P.bass/100,1.0);
  if(isTitle && P.bass>0)
    piano(mtof(root+ar.bass-24),t0,0.20*P.bass/100,1.0);

  // 一句能占多长：句子间隔的六成，最多 2.6 秒。
  // turn 调快时句子挤在一起，乐句要跟着缩——不缩就会互相踩。
  const span=Math.min(2.6,Math.max(0.25,gapSec*0.6));
  const nMax=isTitle?5:Math.max(1,Math.round(P.dens/100*4));
  const n=Math.max(1,Math.min(nMax,Math.round(span/0.34)));

  for(let k=0;k<n;k++){
    // 步进：±1 个和弦音，偶尔停在原地
    const step=[-1,-1,0,1,1,2][Math.floor(Math.random()*6)];
    A.mel=Math.max(0,Math.min(ar.tones.length*2-1,A.mel+step));
    const oct=Math.floor(A.mel/ar.tones.length);
    const deg=ar.tones[A.mel%ar.tones.length];
    const midi=root+ar.bass+deg+12*(1+oct);
    // 弹性节奏：每个音的间隔不等，越靠后越松
    const rub=1+(Math.random()-0.5)*P.rubato/100*0.9;
    const at=t0+span*(k/n)*rub+ (k?0.02*Math.random():0);
    const vel=(isTitle?0.20:0.15)*(0.72+Math.random()*0.42)*(k===0?1.15:0.9);
    piano(mtof(midi),at,vel,1.0);
    // 偶尔叠一个下方六度，坂本很常见的那种空隙
    if(!isTitle && k===0 && Math.random()<0.34)
      piano(mtof(midi-9),at+0.03,vel*0.55,1.0);
  }
}

function audioSync(){
  if(!A.on||!A.ctx)return;
  const t=A.ctx.currentTime;
  A.master.gain.setTargetAtTime(P.vol/100*0.62,t,0.15);
  A.lp.frequency.setTargetAtTime(P.tone,t,0.2);
  A.wet.gain.setTargetAtTime(P.pedal/100*0.9,t,0.25);
}

async function soundToggle(force){
  const b=$('sound');
  const want = force===undefined ? !A.on : force;
  if(want){
    if(!A.ctx&&!audioInit()){b.textContent='No audio';b.disabled=true;A.armed=false;return}
    await A.ctx.resume();
    A.on=true; A.armed=true;
    b.textContent='Sound off'; b.setAttribute('aria-pressed','true');
  }else{
    A.on=false; A.armed=false;
    if(A.ctx) A.master.gain.setTargetAtTime(0,A.ctx.currentTime,0.15);
    b.textContent='Sound on'; b.setAttribute('aria-pressed','false');
  }
}
$('sound').addEventListener('click',()=>soundToggle());

/* 默认开着，但浏览器不许未经手势出声——这是硬约束，不是设置能绕过的。
   所以「默认开」的正确含义是**默认武装**：任何一下交互（点、按键、滚动、触摸）
   都会让它立刻响，用户不用去找按钮。 */
function firstGesture(){
  if(A.armed&&!A.on) soundToggle(true);
  ['pointerdown','keydown','wheel','touchstart'].forEach(ev=>removeEventListener(ev,firstGesture));
}
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>
  addEventListener(ev,firstGesture,{passive:true}));

/* ---------- 目录 ---------- */
function buildTOC(){
  const ol=$('toc'); ol.textContent='';
  lines.forEach((s,i)=>{
    const li=document.createElement('li');
    li.textContent=s; li.tabIndex=0;
    li.onclick=()=>jump(i);
    li.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();jump(i)}};
    ol.appendChild(li);
  });
}

resize(); rebuildAll(); buildTOC(); cellHint();
if(reduce){ setPaused(true); $('hint').textContent='Paused for reduced motion. Press Play to start.'; }
setTimeout(()=>$('hint').classList.add('gone'),6000);
requestAnimationFrame(tick);

</script>
